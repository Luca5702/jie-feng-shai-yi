<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#EAF5FB" />
  <title>借风晒衣</title>
  <meta name="description" content="看准风向，把衣服晒干。一款轻松的 3×3 解谜小游戏。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="index.css?v=3" />
</head>
<body>
  <div id="app">
    <!-- 首页 -->
    <section class="screen" id="screen-home">
      <div class="home-sky">
        <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
      </div>
      <div class="home-inner">
        <div class="home-line" id="home-line" aria-hidden="true"></div>
        <h1 class="logo">借风晒衣</h1>
        <p class="tagline">看准风向，把衣服晒干</p>
        <div class="home-actions">
          <button class="btn btn-primary btn-xl" id="btn-start">开始游戏</button>
          <div class="home-links">
            <button class="btn btn-ghost" id="btn-levels">选择关卡</button>
            <button class="btn btn-ghost" id="btn-howto-home">怎么玩</button>
          </div>
        </div>
      </div>
      <button class="icon-btn home-sound" id="btn-home-sound" aria-label="声音"></button>
    </section>

    <!-- 关卡地图 -->
    <section class="screen" id="screen-map" hidden>
      <header class="topbar">
        <button class="icon-btn" id="btn-map-back" aria-label="返回">
          <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" /></svg>
        </button>
        <div class="topbar-title">选择关卡</div>
        <div class="star-total" id="star-total"></div>
      </header>
      <div class="map-scroll" id="map-list"></div>
    </section>

    <!-- 游戏 -->
    <section class="screen" id="screen-play" hidden>
      <header class="topbar">
        <button class="icon-btn" id="btn-play-back" aria-label="返回">
          <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" /></svg>
        </button>
        <div class="topbar-title" id="play-title">第 1 关</div>
        <button class="icon-btn" id="btn-menu" aria-label="菜单">
          <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6" /><circle cx="12" cy="12" r="1.6" /><circle cx="19" cy="12" r="1.6" /></svg>
        </button>
      </header>

      <div class="score-row">
        <div class="score-num"><b id="score-now">0</b><span>/ <i id="score-target">20</i> 分</span></div>
        <div class="progress" id="progress">
          <div class="progress-fill" id="progress-fill"></div>
          <div class="progress-goal" id="progress-goal"></div>
        </div>
      </div>

      <div class="wind-row" id="wind-row"></div>

      <div class="stage">
        <div class="coach" id="coach" hidden></div>
        <div class="board-wrap" id="board-wrap">
          <div class="wind-side" id="wind-side"></div>
          <div class="board" id="board"></div>
          <div class="gust-layer" id="gust-layer"></div>
        </div>
        <div class="hint-line" id="hint-line"></div>
      </div>

      <footer class="tray">
        <div class="tray-main">
          <div class="current-card" id="current-card"></div>
          <div class="tray-side">
            <div class="queue" id="queue"></div>
            <div class="tray-actions">
              <button class="chip-btn" id="btn-ticket"></button>
              <button class="btn btn-primary btn-confirm" id="btn-confirm" hidden>挂在这里</button>
            </div>
          </div>
        </div>
      </footer>

      <div class="toast" id="toast"></div>
      <div class="demo-banner" id="demo-banner" hidden>示范中 · 点这里停止</div>
    </section>

    <!-- 弹层 -->
    <div class="layer" id="layer" hidden>
      <div class="scrim" id="scrim"></div>
      <div class="sheet" id="sheet"></div>
    </div>
  </div>

  <script type="module" src="app.js?v=3"></script>
</body>
</html>
